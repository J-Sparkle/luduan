name: 🐛 Bug 报告
description: 报告一个 Bug
title: '[Bug] '
labels: [bug, triage]
body:
  - type: textarea
    id: what
    attributes:
      label: Bug 描述
      description: 简洁清晰地描述这个 Bug。
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 一步步告诉我们如何复现。
      placeholder: |
        1. 打开网页 ...
        2. 选中文本 ...
        3. 看到 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 插件版本
      placeholder: 0.1.0
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: 浏览器
      options:
        - Chrome
        - Edge
        - Brave
        - Arc
        - 其他 Chromium
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: 使用的 AI Provider / 模型
      placeholder: 例如 DeepSeek deepseek-chat / Claude claude-sonnet-4-6

  - type: textarea
    id: logs
    attributes:
      label: 控制台日志（可选）
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: 其他信息（截图等）
