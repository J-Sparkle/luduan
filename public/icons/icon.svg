<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!--
    Bookish-minimal Luduan extension icon.
    Paper-tone rounded square + vesica-piscis mark (two overlapping circles,
    intersection filled vermillion). Matches the on-page brand mark
    geometry from src/shared/ui/Mark.tsx (r/cx/stroke scaled to taste so the
    glyph reads at 16px in the Chrome toolbar).
  -->
  <rect width="128" height="128" rx="22" fill="#FAFAF6" stroke="#1616161A" stroke-width="1"/>

  <defs>
    <clipPath id="leftClip">
      <circle cx="54" cy="64" r="26"/>
    </clipPath>
  </defs>

  <!-- Two overlapping ink circles -->
  <circle cx="54" cy="64" r="26" fill="none" stroke="#161616" stroke-width="4.6"/>
  <circle cx="74" cy="64" r="26" fill="none" stroke="#161616" stroke-width="4.6"/>

  <!-- Vermillion seal — fill the intersection (right circle clipped to left) -->
  <circle cx="74" cy="64" r="26" fill="#B85540" clip-path="url(#leftClip)" opacity="0.94"/>
</svg>
